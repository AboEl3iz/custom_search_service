# ============================================================
# Ingress — virtual-host routing for all services
# Requires: minikube addons enable ingress
#
# Hosts:
#   search-service.local  →  Express API (port 3000)
#   kibana.local          →  Kibana      (port 5601)
#   pgadmin.local         →  pgAdmin     (port 80)
#   kafka-ui.local        →  Kafka UI    (port 8080)
#
# Add all four lines to C:\Windows\System32\drivers\etc\hosts:
#   <minikube ip>   search-service.local
#   <minikube ip>   kibana.local
#   <minikube ip>   pgadmin.local
#   <minikube ip>   kafka-ui.local
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-service-ingress
  namespace: search-service
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    # ── Search Service API ──────────────────────────────────
    - host: search-service.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: search-service-app-service
                port:
                  number: 3000

    # ── Kibana ─────────────────────────────────────────────
    - host: kibana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana-service
                port:
                  number: 5601

    # ── pgAdmin ────────────────────────────────────────────
    - host: pgadmin.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin-service
                port:
                  number: 80

    # ── Kafka UI ───────────────────────────────────────────
    - host: kafka-ui.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui-service
                port:
                  number: 8080
