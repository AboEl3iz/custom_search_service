# ============================================================
# Kibana — Deployment + Service
# Accessible at: http://kibana.local (via Ingress)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: search-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.11.0
          ports:
            - containerPort: 5601
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch-service:9200"
            - name: SERVER_BASEPATH
              value: ""
            - name: SERVER_REWRITEBASEPATH
              value: "false"
          readinessProbe:
            tcpSocket:
              port: 5601
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 20
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5601
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: kibana-service
  namespace: search-service
spec:
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601
